                        <div className="bg-gray-950 p-2.5 rounded-lg border border-gray-800">
                          <p className="text-gray-500 text-[10px]">TOTAL SGA ALLOCATION</p>
                          <p className="text-base font-bold text-purple-400">30.5 GB</p>
                        </div>
                      </div>
                    </div>

                    {/* Column 4: Background Workers & Database Vault */}
                    <div 
                      onClick={() => setSelectedNode('vault')}
                      className={`cursor-pointer bg-gray-900/90 border rounded-xl p-4 transition-all flex flex-col justify-between space-y-4 ${
                        vaultEnabled ? 'border-emerald-500/30 hover:border-emerald-400 glow-green' : 'border-red-500/30 hover:border-red-400 glow-red'
                      }`}
                    >
                      <div className="flex items-center justify-between border-b border-gray-800 pb-2">
                        <span className="text-xs font-mono font-bold text-gray-200 flex items-center gap-1.5">
                          <Icon name="lock" className="w-4 h-4 text-emerald-400" />
                          BACKGROUND & VAULT
                        </span>
                      </div>

                      <div className="space-y-2 text-xs">
                        <div className="flex justify-between items-center bg-gray-950 p-2 rounded border border-emerald-500/30">
                          <span className="font-mono text-gray-300">DBWR1 (Writer)</span>
                          <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                        </div>
                        <div className="flex justify-between items-center bg-gray-950 p-2 rounded border border-emerald-500/30">
                          <span className="font-mono text-gray-300">LGWR1 (Log)</span>
                          <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                        </div>
                        <div className="flex justify-between items-center bg-gray-950 p-2 rounded border border-emerald-500/30">
                          <span className="font-mono text-gray-300">RVWR0 (Recovery)</span>
                          <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
                        </div>
                      </div>

                      <div className={`p-2.5 rounded-lg border text-xs ${
                        vaultEnabled ? 'bg-emerald-950/40 border-emerald-500/40 text-emerald-300' : 'bg-red-950/40 border-red-500/40 text-red-300'
                      }`}>
                        <p className="font-bold text-[11px] flex items-center gap-1">
                          <Icon name={vaultEnabled ? "shield-check" : "shield-alert"} className="w-3.5 h-3.5" />
                          {vaultEnabled ? 'DB VAULT REALM ON' : 'VAULT OFF'}
                        </p>
                        <p className="text-[10px] text-gray-400 mt-0.5">
                          {vaultEnabled ? 'IFSAPP Realm Active (SYS blocked)' : 'Unprotected SYS access'}
                        </p>
                      </div>
                    </div>

                    {/* Column 5: Disk Storage (ASM) */}
                    <div 
                      onClick={() => setSelectedNode('storage')}
                      className="cursor-pointer bg-gray-900/90 border border-purple-500/30 rounded-xl p-4 hover:border-purple-400 transition-all glow-purple flex flex-col justify-between space-y-4"
                    >
                      <div className="flex items-center justify-between border-b border-gray-800 pb-2">
                        <span className="text-xs font-mono font-bold text-purple-400 flex items-center gap-1.5">
                          <Icon name="hard-drive" className="w-4 h-4" />
                          ASM DISK STORAGE
                        </span>
                      </div>

                      <div className="space-y-3 text-xs">
                        <div>
                          <div className="flex justify-between text-[10px] mb-1">
                            <span className="text-gray-400">+DATA (36.3 GB)</span>
                            <span className="text-purple-400">7% Used</span>
                          </div>
                          <div className="w-full bg-gray-800 h-2 rounded-full overflow-hidden">
                            <div className="bg-purple-500 h-full w-[7%]"></div>
                          </div>
                        </div>

                        <div className="bg-gray-950 p-2 rounded border border-gray-800">
                          <p className="text-gray-500 text-[10px]">REDO LOG GROUPS</p>
                          <p className="text-xs font-bold text-purple-300">2 Groups (50.0 GB)</p>
                        </div>

                        <div className="bg-gray-950 p-2 rounded border border-gray-800">
                          <p className="text-gray-500 text-[10px]">FLASHBACK / FRA FREE</p>
                          <p className="text-xs font-bold text-emerald-400">4.44 GB / 4.45 GB</p>
                        </div>
                      </div>
                    </div>

                  </div>
                </div>
              </div>
            ) : (
              /* MCP Air-Gapped Pipeline View */
              <div className="space-y-6">
                <div className="glass-card p-6 rounded-2xl border border-brandBorder space-y-6">
                  <div>
                    <h2 className="text-base font-bold text-gray-100 flex items-center gap-2">
                      <Icon name="file-text" className="w-5 h-5 text-purple-400" />
                      AIR-GAPPED MCP ARCHITECTURE PIPELINE
                    </h2>
                    <p className="text-xs text-gray-400 mt-1">
                      Isolated RDP SQL Server Express → Markdown (.md) Export → Local FastMCP AI Agent Reporting Engine
                    </p>
                  </div>

                  {/* 4-Step Pipeline Stepper */}
                  <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div className="bg-gray-900 p-4 rounded-xl border border-gray-800 space-y-2">
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-mono text-blue-400">STEP 1</span>
                        <Icon name="server" className="w-4 h-4 text-gray-500" />
                      </div>
                      <p className="text-xs font-bold text-gray-200">RDP SQLExpress Metrics</p>
                      <p className="text-[11px] text-gray-400">Stores daily/weekly metrics inside isolated environment.</p>
                    </div>

                    <div className="bg-gray-900 p-4 rounded-xl border border-gray-800 space-y-2">
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-mono text-emerald-400">STEP 2</span>
                        <Icon name="hard-drive-upload" className="w-4 h-4 text-gray-500" />
                      </div>
                      <p className="text-xs font-bold text-gray-200">T-SQL Markdown Export</p>
                      <p className="text-[11px] text-gray-400">Generates structured .md files using xp_cmdshell script.</p>
                    </div>

                    <div className="bg-gray-900 p-4 rounded-xl border border-gray-800 space-y-2">
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-mono text-purple-400">STEP 3</span>
                        <Icon name="workflow" className="w-4 h-4 text-gray-500" />
                      </div>
                      <p className="text-xs font-bold text-gray-200">Local FastMCP Server</p>
                      <p className="text-[11px] text-gray-400">Local MCP Server reads .md export files safely.</p>
                    </div>

                    <div className="bg-gray-900 p-4 rounded-xl border border-gray-800 space-y-2">
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-mono text-amber-400">STEP 4</span>
                        <Icon name="zap" className="w-4 h-4 text-gray-500" />
                      </div>
                      <p className="text-xs font-bold text-gray-200">AI Executive Report</p>
                      <p className="text-[11px] text-gray-400">AI Agent generates C-level summaries without internet exposure.</p>
                    </div>
                  </div>

                  {/* Markdown Live Preview & Copy Box */}
                  <div className="bg-gray-950 rounded-xl border border-gray-800 p-4 space-y-3 font-mono">
                    <div className="flex items-center justify-between border-b border-gray-800 pb-2">
                      <span className="text-xs text-gray-400 flex items-center gap-2">
                        <Icon name="file-text" className="w-4 h-4 text-blue-400" />
                        EXPORTED FILE: metrics_export_20261105.md
                      </span>
                      <button
                        onClick={copyToClipboard}
                        className="flex items-center space-x-1 px-3 py-1 bg-gray-800 hover:bg-gray-700 text-gray-200 text-xs rounded border border-gray-700 transition-all"
                      >
                        <Icon name="copy" className="w-3.5 h-3.5" />
                        <span>{copied ? 'COPIED!' : 'Copy Markdown'}</span>
                      </button>
                    </div>

                    <pre className="text-xs text-emerald-400 overflow-x-auto p-2 bg-gray-900/50 rounded max-h-60">
                      {markdownExportContent}
                    </pre>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* Node Detail Modal */}
          {selectedNode && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="glass-card max-w-lg w-full rounded-2xl border border-brandBorder p-6 space-y-4">
                <div className="flex items-center justify-between border-b border-gray-800 pb-3">
                  <h3 className="font-mono font-bold text-sm text-blue-400 flex items-center gap-2">
                    <Icon name="layers" className="w-4 h-4" />
                    COMPONENT METRICS: {selectedNode.toUpperCase()}
                  </h3>
                  <button 
                    onClick={() => setSelectedNode(null)}
                    className="text-gray-400 hover:text-white p-1 rounded-lg hover:bg-gray-800"
                  >
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="space-y-3 text-xs text-gray-300">
                  <div className="bg-gray-900 p-3 rounded-lg border border-gray-800 space-y-1">
                    <p className="text-gray-400 text-[10px] font-mono">STATUS DIAGNOSTICS</p>
                    <p className="font-bold text-emerald-400">All checks passed — 0 latencies detected</p>
                  </div>

                  <div className="bg-gray-900 p-3 rounded-lg border border-gray-800 space-y-1 font-mono text-[11px]">
                    <p className="text-gray-500 text-[10px]">ORACLE DYNAMIC VIEW</p>
                    <p className="text-purple-300">
                      {selectedNode === 'vault' ? 'SELECT * FROM DVSYS.DBA_DV_REALM;' : 'SELECT * FROM V$SGA_DYNAMIC_COMPONENTS;'}
                    </p>
                  </div>
                </div>

                <div className="flex justify-end pt-2">
                  <button
                    onClick={() => setSelectedNode(null)}
                    className="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-xs text-gray-200 font-medium rounded-lg border border-gray-700"
                  >
                    Close Inspector
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
